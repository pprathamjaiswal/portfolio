{% load static %}<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}{{ seo.title }}{% endblock %}</title>

<meta name="description" content="{% block description %}{{ seo.description }}{% endblock %}">
<meta name="keywords" content="{{ seo.keywords }}">
<meta name="author" content="{{ profile.name|default:'Pratham Jaiswal' }}">
<meta name="robots" content="index, follow">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="{{ seo.theme_color_dark }}" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="{{ seo.theme_color_light }}" media="(prefers-color-scheme: light)">
<link rel="canonical" href="{{ site_url }}{{ request.path }}">

<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ profile.name|default:'Pratham Jaiswal' }}">
<meta property="og:title" content="{{ seo.title }}">
<meta property="og:description" content="{{ seo.description }}">
<meta property="og:url" content="{{ site_url }}{{ request.path }}">
<meta property="og:locale" content="{{ seo.locale }}">
<meta property="og:image" content="{{ site_url }}{% static 'img/og-image.png' %}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ seo.title }}">
<meta name="twitter:description" content="{{ seo.description }}">
<meta name="twitter:image" content="{{ site_url }}{% static 'img/og-image.png' %}">

<link rel="icon" href="{% static 'img/favicon.svg' %}" type="image/svg+xml">
<link rel="apple-touch-icon" href="{% static 'img/apple-touch-icon.png' %}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"></noscript>

<link rel="stylesheet" href="{% static 'css/style.css' %}">

<script>
/* Set the theme before first paint so there is no flash of the wrong theme. */
(function () {
  document.documentElement.classList.add('js');
  try {
    var stored = localStorage.getItem('theme');
    var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
    var theme = stored || (prefersLight ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', theme);
  } catch (e) { /* private mode — keep the default */ }
})();
</script>

{% block head_extra %}{% endblock %}
</head>

<body>
<a class="skip-link" href="#main">Skip to content</a>
{% include "partials/icons.html" %}

{% block body %}{% endblock %}

<script src="{% static 'js/main.js' %}" defer></script>
{% block scripts %}{% endblock %}
</body>
</html>
