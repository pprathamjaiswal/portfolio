{% comment %}
Inline styles and a table layout on purpose — email clients strip <style>
blocks and do not support modern CSS.
{% endcomment %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New portfolio enquiry</title>
</head>
<body style="margin:0;padding:24px 12px;background:#f2f4f8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#0d1220;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="max-width:580px;margin:0 auto;background:#ffffff;border-radius:14px;overflow:hidden;border:1px solid #e2e6ee;">
    <tr>
      <td style="padding:22px 28px;background:linear-gradient(135deg,#4f46e5,#0e7490);">
        <p style="margin:0;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:rgba(255,255,255,0.78);">New enquiry</p>
        <p style="margin:6px 0 0;font-size:21px;font-weight:700;color:#ffffff;">{{ name }} got in touch</p>
      </td>
    </tr>

    <tr>
      <td style="padding:26px 28px 6px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
          <tr>
            <td style="padding:0 0 10px;font-size:12px;color:#6b7486;width:78px;">Name</td>
            <td style="padding:0 0 10px;font-size:14px;font-weight:600;">{{ name }}</td>
          </tr>
          <tr>
            <td style="padding:0 0 10px;font-size:12px;color:#6b7486;">Email</td>
            <td style="padding:0 0 10px;font-size:14px;">
              <a href="mailto:{{ email }}" style="color:#4f46e5;text-decoration:none;">{{ email }}</a>
            </td>
          </tr>
          <tr>
            <td style="padding:0 0 10px;font-size:12px;color:#6b7486;">Received</td>
            <td style="padding:0 0 10px;font-size:14px;">{{ received_at|date:"j F Y, g:i a" }}</td>
          </tr>
        </table>
      </td>
    </tr>

    <tr>
      <td style="padding:10px 28px 4px;">
        <div style="padding:18px 20px;background:#f7f8fb;border:1px solid #e6eaf2;border-left:3px solid #4f46e5;border-radius:10px;font-size:15px;line-height:1.65;white-space:pre-wrap;">{{ message }}</div>
      </td>
    </tr>

    <tr>
      <td style="padding:22px 28px 26px;">
        <a href="mailto:{{ email }}"
           style="display:inline-block;padding:11px 22px;background:#4f46e5;color:#ffffff;font-size:14px;font-weight:600;text-decoration:none;border-radius:9px;">
          Reply to {{ name }}
        </a>
        <p style="margin:16px 0 0;font-size:12px;color:#6b7486;line-height:1.6;">
          You can also just hit Reply — this email is addressed back to {{ email }}.<br>
          <a href="{{ admin_url }}" style="color:#6b7486;">View all messages</a>
        </p>
      </td>
    </tr>
  </table>
</body>
</html>
